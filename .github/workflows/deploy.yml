name: Deploy na Endoru

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalace závislostí
        run: npm ci

      # Cache zmenšených fotek, ať se při každém buildu nepřepočítávají
      - name: Cache obrázků
        uses: actions/cache@v4
        with:
          path: node_modules/.astro
          key: astro-images-${{ hashFiles('src/fotky/**') }}
          restore-keys: astro-images-

      - name: Build
        run: npm run build

      - name: Nahrání na FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          # Zatím jen do podsložky, ostrý web na kořeni zůstává netknutý.
          # Až bude nový web hotový, změň na kořen webu (a base v astro.config.mjs na '/').
          server-dir: /public_html/novy/
          # Nahrává jen změněné soubory (podle .ftp-deploy-sync-state.json na serveru).
          # Nikdy nečistí celý cíl; mimo server-dir nesahá vůbec.
          dangerous-clean-slate: false
